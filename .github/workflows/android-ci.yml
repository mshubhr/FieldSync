name: Android CI

on:
  push:
    branches:
      - main
      - fix/github-actions-ci
  pull_request:
    branches:
      - main
      - fix/github-actions-ci

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Android app
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test